name: Site Monitor Check

# ==========================================================
# ALERTING BEHAVIOR
# ==========================================================
# This workflow performs uptime checks on a scheduled basis
# and sends notifications via email and ntfy.
#
# TARGET_URL now accepts one or more URLs, comma-separated.
# Example: https://leelinkoff.com,https://nuvrix.io
#
# Alerting rules (per URL):
#
# - UP → UP
#     No alert (no noise when system is healthy)
#
# - UP → DOWN
#     Send alert (initial failure detection)
#
# - DOWN → DOWN
#     Send alert every scheduled run (persistent failure reminders)
#
# - DOWN → UP
#     Send alert once (recovery notification)
#
# If any URL needs an alert this run, one consolidated email/ntfy
# message is sent listing every monitored URL's current status,
# formatted as:
#
#     <url>: UP
#     <url>: DOWN
#
# Schedule behavior:
#
# - cron: "17 * * * *"
#     Runs once per hour at minute 17 (UTC)
#     Note: GitHub Actions scheduling is best-effort and may not run exactly on time
#
# State tracking:
#
# - Previous status per URL is persisted in the `state` branch (status.txt)
# - status.txt format: one line per URL, "URL=STATUS"
# - The `state` branch is separate from main (main history stays clean)
# - State commits never appear on main
#
# Known limitation:
#
# - On the very first run, status.txt does not exist
# - Any URL not yet in status.txt defaults to UP
# - This means a first-run DOWN will correctly trigger an alert
#
# ==========================================================

# ==========================================================
# TRIGGERS
# ==========================================================
on:
  schedule:
    - cron: "17 * * * *"     # hourly schedule (best-effort; GitHub Actions timing is not exact, runs near top of hour UTC)
  workflow_dispatch:          # allows manual runs from the UI

jobs:
  check:
    runs-on: ubuntu-latest

    # ======================================================
    # PERMISSIONS REQUIRED TO PUSH STATE TO STATE BRANCH
    # ======================================================
    permissions:
      contents: write

    # ======================================================
    # ENV VARIABLES (SET IN REPO SETTINGS)
    # ======================================================
    env:
      TARGET_URL: ${{ vars.TARGET_URL }}     # URL(s) to monitor, comma-separated
      EMAIL_TO: ${{ secrets.EMAIL_TO }}      # alert destination email
      GMAIL_USER: ${{ secrets.GMAIL_USER }}  # Gmail sender
      GMAIL_PASS: ${{ secrets.GMAIL_PASS }}  # Gmail APP PASSWORD (NOT normal password)
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}  # ntfy topic

    steps:

      # ==========================================================
      # LOGGING BEHAVIOR (GITHUB ACTIONS QUIRK)
      # ==========================================================
      # All logs use echo:
      #   echo "[INFO] message"
      #   echo "[ERROR] message"
      #
      # IMPORTANT:
      # - GitHub Actions automatically prefixes failed step output with:
      #     "Error: ..."
      #
      # - This happens whenever the script exits non-zero (e.g., exit 1)
      # - It is NOT controlled by echo, printf, stdout, or stderr
      # - It cannot be disabled from within the workflow
      #
      # RESULT:
      # - Informational logs appear exactly as written:
      #     [INFO] ...
      #
      # - Error logs may appear as:
      #     Error: ...
      #   even if the script prints:
      #     [ERROR] ...
      #
      # This inconsistency is caused by GitHub's runner, not the script.
      # ==========================================================

      # ======================================================
      # STEP 1: CHECKOUT
      # ======================================================
      # Required for all git operations (state branch read/write)
      - name: Checkout
        uses: actions/checkout@v4

      # ======================================================
      # STEP 2: DEBUG CONFIG
      # ======================================================
      - name: Debug configuration
        run: |
          echo "[INFO] ========== CONFIG =========="
          echo "[INFO] TARGET_URL=$TARGET_URL"
          echo "[INFO] EMAIL_TO=$EMAIL_TO"
          echo "[INFO] NTFY_TOPIC=$NTFY_TOPIC"
          echo "[INFO] GMAIL_USER=$GMAIL_USER"
          echo "[INFO] GMAIL_PASS_LENGTH=${#GMAIL_PASS}"

          # HARD FAIL IF REQUIRED VALUES MISSING
          if [ -z "$TARGET_URL" ]; then
            echo "[ERROR] TARGET_URL is not set"
            exit 1
          fi

          if [ -z "$EMAIL_TO" ]; then
            echo "[ERROR] EMAIL_TO is not set"
            exit 1
          fi

          if [ -z "$GMAIL_USER" ]; then
            echo "[ERROR] GMAIL_USER is not set"
            exit 1
          fi

          if [ -z "$GMAIL_PASS" ]; then
            echo "[ERROR] GMAIL_PASS is not set (must be Gmail App Password)"
            exit 1
          fi

          if [ -z "$NTFY_TOPIC" ]; then
            echo "[ERROR] NTFY_TOPIC is not set"
            exit 1
          fi

          echo "[INFO] CONFIG VALID"
          echo "[INFO] ============================"

      # ======================================================
      # STEP 3: CHECK SITES (LOOP OVER COMMA-SEPARATED TARGET_URL)
      # ======================================================
      - name: Check sites
        id: check
        run: |
          set -euo pipefail

          echo "[INFO] ========== SITE CHECK =========="

          IFS=',' read -ra URLS <<< "$TARGET_URL"

          RESULTS=""

          for RAW_URL in "${URLS[@]}"; do
            URL=$(echo "$RAW_URL" | xargs)
            [ -z "$URL" ] && continue

            echo "[INFO] Checking URL: $URL"

            # FIX: initialize CURL_EXIT=0 before curl so it's never unbound under set -u
            CURL_EXIT=0
            CURL_OUTPUT=$(curl -v --max-time 10 --connect-timeout 5 -o /dev/null -s -w '%{http_code}' "$URL" 2>&1) || CURL_EXIT=$?

            HTTP_CODE=$(echo "$CURL_OUTPUT" | tail -n1)

            echo "[INFO] ---- CURL OUTPUT ----"
            echo "[INFO] $CURL_OUTPUT"
            echo "[INFO] ---------------------"

            if [ "$CURL_EXIT" != "0" ]; then
              echo  "[ERROR] NETWORK FAILURE"
              echo  "[ERROR] DETAIL: DNS failure, timeout, or unreachable host"
              HTTP_CODE="000"
            fi

            echo "[INFO] HTTP_CODE=$HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ]; then
              STATUS="UP"
            else
              STATUS="DOWN"
            fi

            echo "[INFO] STATUS=$STATUS"

            RESULTS="${RESULTS}${URL}=${STATUS}"$'\n'
          done

          echo "[INFO] ==============================="

          {
            echo "results<<SITECHECK_EOF"
            printf '%s\n' "$RESULTS"
            echo "SITECHECK_EOF"
          } >> "$GITHUB_OUTPUT"

      # ======================================================
      # STEP 4: RESTORE PREVIOUS STATE (STATE BRANCH)
      # ======================================================
      # Reads status.txt from the root of the `state` branch.
      # Format: one line per URL, "URL=STATUS"
      # This branch only holds status.txt (never shown on main).
      # Any URL missing from status.txt defaults to UP.
      - name: Restore previous status
        id: restore
        run: |
          echo "[INFO] ========== STATE RESTORE =========="

          PREV_CONTENT=""

          # Attempt to fetch state branch, may not exist on first run
          if git ls-remote --exit-code origin state > /dev/null 2>&1; then
            git fetch origin state
            git checkout origin/state -- status.txt 2>/dev/null || true

            if [ -f status.txt ]; then
              PREV_CONTENT=$(cat status.txt)
              echo "[INFO] State file found"
            else
              echo "[INFO] State file not found on state branch, defaulting all to UP"
            fi
          else
            echo "[INFO] State branch does not exist yet, defaulting all to UP"
          fi

          echo "[INFO] $PREV_CONTENT"
          echo "[INFO] ======================================="

          {
            echo "prev_content<<RESTORE_EOF"
            printf '%s\n' "$PREV_CONTENT"
            echo "RESTORE_EOF"
          } >> "$GITHUB_OUTPUT"

      # ======================================================
      # STEP 5: DECIDE IF ALERT IS NEEDED, BUILD MESSAGE BODY
      # ======================================================
      - name: Decide alert
        id: decide
        run: |
          CURRENT="${{ steps.check.outputs.results }}"
          PREVIOUS="${{ steps.restore.outputs.prev_content }}"

          SEND_ALERT="false"
          ANY_DOWN="false"
          BODY=""

          # RULES (per URL):
          # - Always alert if DOWN (repeat notifications)
          # - Alert once when recovering (DOWN -> UP)
          while IFS='=' read -r URL STATUS; do
            [ -z "$URL" ] && continue

            PREV_STATUS=$(echo "$PREVIOUS" | grep "^${URL}=" | cut -d'=' -f2)
            [ -z "$PREV_STATUS" ] && PREV_STATUS="UP"

            echo "[INFO] $URL CURRENT_STATUS=$STATUS PREVIOUS_STATUS=$PREV_STATUS"

            if [ "$STATUS" = "DOWN" ]; then
              SEND_ALERT="true"
              ANY_DOWN="true"
            elif [ "$STATUS" = "UP" ] && [ "$PREV_STATUS" = "DOWN" ]; then
              SEND_ALERT="true"
            fi

            BODY="${BODY}<${URL}>: ${STATUS}"$'\n'
          done <<< "$CURRENT"

          echo "[INFO] SEND_ALERT=$SEND_ALERT"
          echo "send_alert=$SEND_ALERT" >> "$GITHUB_OUTPUT"

          if [ "$ANY_DOWN" = "true" ]; then
            echo "subject=SITE DOWN" >> "$GITHUB_OUTPUT"
          else
            echo "subject=SITE UP" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "body<<DECIDE_EOF"
            printf '%s\n' "$BODY"
            echo "DECIDE_EOF"
          } >> "$GITHUB_OUTPUT"

      # ======================================================
      # STEP 6: INSTALL SMTP CLIENT (ONLY IF NEEDED)
      # ======================================================
      - name: Install msmtp
        if: steps.decide.outputs.send_alert == 'true'
        run: |
          echo "[INFO] Installing email client (msmtp)..."

          sudo apt-get update || {
            echo "[ERROR] apt-get update failed"
            exit 1
          }

          sudo apt-get install -y msmtp || {
            echo "[ERROR] msmtp installation failed"
            exit 1
          }

          echo "[INFO] msmtp installed"

      # ======================================================
      # STEP 7: CONFIGURE SMTP (ONLY IF NEEDED)
      # ======================================================
      - name: Configure SMTP
        if: steps.decide.outputs.send_alert == 'true'
        run: |
          echo "[INFO] Configuring Gmail SMTP..."

          echo "account default" > ~/.msmtprc
          echo "host smtp.gmail.com" >> ~/.msmtprc
          echo "port 587" >> ~/.msmtprc
          echo "auth on" >> ~/.msmtprc
          echo "user $GMAIL_USER" >> ~/.msmtprc
          echo "password $GMAIL_PASS" >> ~/.msmtprc
          echo "from $GMAIL_USER" >> ~/.msmtprc
          echo "tls on" >> ~/.msmtprc
          echo "tls_starttls on" >> ~/.msmtprc

          chmod 600 ~/.msmtprc || {
            echo "[ERROR] Failed to secure SMTP config file"
            exit 1
          }

          echo "[INFO] SMTP CONFIG READY"

      # ======================================================
      # STEP 8: SEND ALERTS (ONLY IF NEEDED)
      # ======================================================
      # Message body, one line per monitored URL:
      #   <url>: UP
      #   <url>: DOWN
      - name: Send alerts
        if: steps.decide.outputs.send_alert == 'true'
        run: |
          set -euo pipefail

          SUBJECT="${{ steps.decide.outputs.subject }}"
          BODY="${{ steps.decide.outputs.body }}"

          echo "[INFO] ========== ALERT PHASE =========="
          echo "[INFO] SUBJECT=$SUBJECT"
          echo "[INFO] BODY:"
          echo "[INFO] $BODY"

          printf 'Subject: %s\n\n%s\n' "$SUBJECT" "$BODY" > mail.txt

          # --------------------------------------------------
          # EMAIL SEND
          # --------------------------------------------------
          echo "[INFO] Sending email..."

          msmtp "$EMAIL_TO" < mail.txt 2>&1 || {
            echo "[ERROR] EMAIL SEND FAILED"
            echo "[ERROR] DETAIL: Gmail app password incorrect, 2FA not enabled, Gmail blocking SMTP, EMAIL_TO invalid."
            exit 1
          }

          echo "[INFO] EMAIL SENT OK"

          # --------------------------------------------------
          # NTFY SEND
          # --------------------------------------------------
          echo "[INFO] Sending ntfy push..."

          curl -v -H "Title: $SUBJECT" -H "Priority: high" -H "Cache: yes" -d "$BODY" "https://ntfy.sh/$NTFY_TOPIC" 2>&1 || {
            echo "[ERROR] NTFY PUSH FAILED"
            echo "[ERROR] DETAIL: ntfy topic invalid, network issue."
            exit 1
          }

          echo "[INFO] NTFY SENT OK"
          echo "[INFO] ================================"

      # ======================================================
      # STEP 9: SAVE STATE TO STATE BRANCH
      # ======================================================
      # Writes status.txt to the root of the `state` branch.
      # Format: one line per URL, "URL=STATUS"
      # The `state` branch is completely separate from main.
      # Main history stays clean (no state commits ever appear on main).
      - name: Save state
        run: |
          echo "[INFO] ========== STATE SAVE =========="

          RESULTS="${{ steps.check.outputs.results }}"

          # Configure git
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Check out state branch if it exists, otherwise create it
          if git ls-remote --exit-code origin state > /dev/null 2>&1; then
            git fetch origin state
            git checkout -b state origin/state
          else
            echo "[INFO] Creating state branch for the first time"
            git checkout --orphan state
            git rm -rf . > /dev/null 2>&1 || true
          fi

          # Write all current statuses to root of state branch
          printf '%s' "$RESULTS" > status.txt

          git add status.txt
          git diff --staged --quiet || git commit -m "state"
          git push origin state

          echo "[INFO] Saved to state branch:"
          echo "[INFO] $RESULTS"
          echo "[INFO] ==================================="
